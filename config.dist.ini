# LCD Status Panel configuration.
# Edit with any text editor, then restart the panel for changes to take effect.

[display]
# orientation: landscape | landscape_180 | portrait | portrait_180
# The 180 variants are the same layout rotated, for when the USB cable needs
# to come out the other side.
orientation = landscape

# brightness: 0-100
brightness = 80

[dictation]
# Optional. Path to a JSON file containing {"state": "...", "ts": <unix time>}
# where state is one of: listening, transcribing, idle, offline.
# Leave BLANK to hide the dictation panel entirely (most people want this) -
# the microphone panel then takes the full width.
status_file =

[thresholds]
# Values at or above _warn turn yellow; at or above _bad turn red.
# Percentages are 0-100; temperatures are in Celsius.
cpu_warn = 50
cpu_bad = 80
cpu_temp_warn = 75
cpu_temp_bad = 85
ram_warn = 65
ram_bad = 80
gpu_warn = 50
gpu_bad = 80
gpu_temp_warn = 50
gpu_temp_bad = 60
vram_warn = 50
vram_bad = 80
